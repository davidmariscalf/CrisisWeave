name: Cross-repo E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: crisisweave-cross-repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout umbrella repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run eleven-repository integration
        run: python integrate.py --workspace "$RUNNER_TEMP/crisisweave"

      - name: Verify integration summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'crisisweave' / 'artifact' / 'summary.json'
          s = json.loads(p.read_text())
          assert s['repositories_combined'] == 11, s
          assert s['public_contract_checks'] == 'passed', s
          assert s['platform_tests'] == 'passed', s
          assert s['platform_identity_bootstrap'] == 'passed', s
          assert s['raw_token_storage_check'] == 'passed', s
          assert s['demo_worksites'] >= 1, s
          assert s['alerts'] >= 1, s
          print(json.dumps(s, indent=2))
          PY

      - name: Upload E2E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisisweave-e2e
          path: ${{ runner.temp }}/crisisweave/artifact
          if-no-files-found: error
          retention-days: 14
