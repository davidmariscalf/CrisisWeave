name: Cross-repo E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: crisisweave-cross-repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    name: Cross-repo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout umbrella repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile umbrella sources
        run: python -m py_compile integrate.py case_studies.py run_pinned.py seal_artifact.py production_check.py

      - name: Run production preflight
        run: python production_check.py

      - name: Run umbrella unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Run eleven-repository integration at locked revisions
        run: python run_pinned.py --workspace "$RUNNER_TEMP/crisisweave"

      - name: Verify integration summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'crisisweave' / 'artifact'
          s = json.loads((root / 'summary.json').read_text())
          assert s['repositories_combined'] == 11, s
          assert s['case_studies'] == 3, s
          assert s['case_study_checks'] == 'passed', s
          assert s['public_contract_checks'] == 'passed', s
          assert s['platform_tests'] == 'passed', s
          assert s['platform_identity_bootstrap'] == 'passed', s
          assert s['raw_token_storage_check'] == 'passed', s
          assert s['public_site_provenance'] == 'passed', s
          assert s['deploy_stack_pins'] == 'match_locked_components', s
          assert len(s['public_site_source_revision']) == 40, s
          assert (root / 'infra' / 'site' / 'build.json').is_file(), s
          assert s['demo_worksites'] >= 1, s
          assert s['alerts'] >= 1, s
          synthetic = [json.loads(x) for x in (root / 'synthetic.jsonl').read_text().splitlines() if x.strip()]
          assert synthetic and all(x.get('synthetic') is True for x in synthetic)
          print(json.dumps(s, indent=2))
          PY

      - name: Install pinned browser smoke-test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Cold-start field package with network disabled
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/crisisweave/artifact/web" >"$RUNNER_TEMP/crisisweave-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null
          CW_WEB_URL=http://127.0.0.1:8765 node tests/offline_browser_smoke.mjs

      - name: Seal and verify generated artifact
        run: |
          python seal_artifact.py "$RUNNER_TEMP/crisisweave/artifact" --lock components.lock.json
          python seal_artifact.py "$RUNNER_TEMP/crisisweave/artifact" --verify

      - name: Upload E2E artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crisisweave-e2e
          path: ${{ runner.temp }}/crisisweave/artifact
          if-no-files-found: error
          retention-days: 14
